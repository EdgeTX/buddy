yarnPath: .yarn/releases/yarn-4.18.1.cjs

nodeLinker: node-modules

# better node_modules size
nmMode: hardlinks-local

# Keep the per-project cache (.yarn/cache) as with Yarn 3.
# Don't compress, as we are not using zero-installs (yet)
enableGlobalCache: false
compressionLevel: 0

# electron, usb, esbuild, playwright etc. rely on install scripts
enableScripts: true
